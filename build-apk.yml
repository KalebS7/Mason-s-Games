name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Make icons (only if icon.png exists)
        run: |
          if [ -f icon.png ]; then
            pip install pillow
            python3 make-icons.py
          else
            echo "No icon.png - using default icon"
          fi
      - run: npx cap sync android
      - name: Set app name (apostrophe-safe for Android)
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/res/values/strings.xml'
          s = open(p).read()
          for key in ('app_name', 'title_activity_main'):
              s = re.sub(r'(<string name="%s">).*?(</string>)' % key, r"\1Mason\\'s Games\2", s)
          open(p, 'w').write(s)
          print(s)
          PY
      - name: Use my signing key (only if debug.keystore exists)
        run: |
          if [ -f debug.keystore ]; then
            mkdir -p ~/.android
            cp debug.keystore ~/.android/debug.keystore
          else
            echo "No debug.keystore - using default debug key"
          fi
      - name: Build
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Masons-Games-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
