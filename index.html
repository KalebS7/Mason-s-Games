<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#d6efff"><title>Mason's Games</title>
<style>
:root{--bg:#d6efff;--card:#fff;--raise:#f3faff;--tx:#5a7fa3;--hd:#0f3a63;--ac:#2f9bff;--ac2:#18d0f0;--ol:rgba(40,120,200,.16);--sh:0 1px 2px rgba(30,100,180,.10),0 10px 24px rgba(50,140,220,.18);--gl:0 6px 18px rgba(47,155,255,.4)}
[data-g=cc],[data-th=cc]{--c:#3aa8ff;--c2:#1f6fe8}
[data-g=ar],[data-th=ar]{--c:#8a6bff;--c2:#3a8dff}
[data-g=ttt],[data-th=ttt]{--c:#2fd6c8;--c2:#1f8fe8}
[data-g=c4],[data-th=c4]{--c:#ffb13d;--c2:#ff7a3d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;color:var(--tx);font:15px ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
 background:radial-gradient(700px 420px at 105% -8%,rgba(255,255,255,.95) 0,transparent 60%),radial-gradient(700px 460px at -12% 4%,rgba(120,200,255,.55) 0,transparent 58%),radial-gradient(600px 420px at 50% 112%,rgba(150,225,255,.75) 0,transparent 60%),linear-gradient(180deg,#d9f1ff,#bde4ff);background-attachment:fixed}
/* floating background bubbles (tap them on the home screen to pop them!) */
#bgb{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#bgb i{position:absolute;bottom:-130px;border-radius:50%;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.95) 0,rgba(255,255,255,.4) 16%,rgba(150,215,255,.16) 55%,rgba(90,180,255,.32) 100%);border:1.5px solid rgba(255,255,255,.85);box-shadow:inset 0 0 12px rgba(255,255,255,.6),0 4px 14px rgba(60,150,230,.15);animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}8%{opacity:1}50%{transform:translate(var(--dx),-58vh)}100%{transform:translate(calc(var(--dx)*-1),-125vh);opacity:.9}}
.v{display:none;position:absolute;inset:0;z-index:1;flex-direction:column;padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 6px);overflow-y:auto}
.v.on{display:flex}
header{display:flex;align-items:center;gap:8px;height:64px;flex:none}
h1{margin:0;font-size:34px;font-weight:900;letter-spacing:-.8px;flex:1;min-width:0;white-space:nowrap;background:linear-gradient(90deg,#1c7bff 0,#14c6f2 55%,#7a6bff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(255,255,255,.9))}
h2{margin:0;color:var(--hd);font-weight:800;font-size:20px;flex:1;min-width:0;letter-spacing:-.2px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h2::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--c,var(--ac)),var(--c2,var(--ac2)));margin-right:9px;vertical-align:1px}
button{font:inherit;font-weight:700;color:var(--hd);background:#fff;border:1px solid var(--ol);border-radius:16px;min-height:46px;padding:0 16px;box-shadow:var(--sh);transition:transform .08s,box-shadow .15s}
button:active{transform:scale(.95)}
button.sn{width:42px;min-width:42px;padding:0;display:flex;align-items:center;justify-content:center;flex:none;border-radius:50%}
button.on{border-color:var(--ac);box-shadow:var(--gl)}
header>button:not(.bk):not(.sn){padding:0 16px;white-space:nowrap;background:linear-gradient(135deg,var(--c,var(--ac)),var(--c2,var(--ac2)));color:#fff;border:0;box-shadow:0 6px 14px rgba(30,100,200,.28)}
button[hidden]{display:none}
.bk{width:46px;padding:0;font-size:22px;border-radius:50%}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:2px 0 10px;flex:none;flex-wrap:wrap;color:var(--hd);font-weight:600}
.bar>div{display:flex;gap:8px;align-items:center}
.bar button{min-height:44px;padding:0 18px;border-radius:14px}
.stat{background:#fff;border-bottom:3px solid var(--c,var(--ac));border-radius:12px;padding:7px 12px 5px;color:var(--hd);font-weight:700;min-width:64px;text-align:center;box-shadow:var(--sh);font-size:14px}
/* home */
.tag{margin:0 2px 12px;color:var(--tx);font-weight:700;font-size:15px}
.gl{display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(158px,auto);gap:12px;flex:none}
.gc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;position:relative;overflow:hidden;background:#fff;border:0;border-radius:26px;padding:14px 8px 12px;text-align:center;height:auto;width:100%;min-width:0;margin:0;box-shadow:var(--sh)}
.gc::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,0),var(--c,#3aa8ff));opacity:.16;pointer-events:none}
.gc .i{font-size:32px;width:68px;height:68px;border-radius:22px;background:linear-gradient(145deg,var(--c),var(--c2));display:flex;align-items:center;justify-content:center;color:#fff;flex:none;box-shadow:0 8px 16px rgba(30,100,200,.28);animation:bob 3.2s ease-in-out infinite}
.gc .i svg{width:38px;height:38px}
.gc[data-g=cc] .i{background:linear-gradient(135deg,#ff5f7e,#ffb13d 35%,#3ad6a0 65%,#3a8dff)}
.gc[data-g=ar] .i{background:linear-gradient(135deg,#a98bff,#3aa8ff 55%,#2fd6c8)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}
.gc>span:last-child{display:block;min-width:0;max-width:100%}
.gc b{display:block;color:var(--hd);font-size:16px;line-height:1.15;font-weight:800}.gc br{display:none}
.gc small{display:block;margin-top:4px;color:var(--tx);font-size:11.5px;line-height:1.25;font-weight:600}
.gc.soon{background:rgba(255,255,255,.45);box-shadow:none;border:2px dashed rgba(60,150,230,.4);pointer-events:none}
.gc.soon .i{background:rgba(255,255,255,.7);color:#7fb6e6;box-shadow:none;animation:none}
/* start screen */
#mnB{padding-bottom:24px;margin:auto 0;width:100%}
.big{width:100%;min-height:68px;text-align:left;border-radius:20px;margin-bottom:12px;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:10px 20px}
.big b{font-size:20px;font-weight:800}.big small{opacity:.9;font-size:13px;font-weight:600}
.pri{background:linear-gradient(135deg,var(--c,var(--ac)),var(--c2,var(--ac2)));border:0;color:#fff;box-shadow:0 8px 18px rgba(30,100,200,.3)}
.lbl{margin:16px 2px 8px;font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--c2,var(--ac))}
.sg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.sg button.on{background:linear-gradient(135deg,var(--c,var(--ac)),var(--c2,var(--ac2)));border:0;color:#fff;box-shadow:0 6px 14px rgba(30,100,200,.28)}
.card{background:#fff;border-radius:20px;padding:4px 16px;box-shadow:var(--sh)}
.sr{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--ol);color:var(--tx);font-weight:600}
.sr:last-child{border-bottom:0}.sr b{color:var(--hd);font-weight:800;text-align:right}
/* Color Connect */
#ccW,#arW{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;border-radius:26px;background:linear-gradient(160deg,#f6fcff,#cde9ff);box-shadow:var(--sh),inset 0 0 0 2px rgba(255,255,255,.85);margin-bottom:8px}
#ccC,#arC{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#ccPraise,#arPraise{position:absolute;left:0;right:0;top:9%;text-align:center;font-size:46px;font-weight:900;pointer-events:none;opacity:0;z-index:3;background:linear-gradient(90deg,#ff3b4e,#ff9500,#ffd60a,#34c759,#2f6bff,#a259ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(255,255,255,.95)) drop-shadow(0 7px 10px rgba(40,100,200,.35))}
#ccPraise.on,#arPraise.on{animation:praise 1.05s cubic-bezier(.2,1.4,.4,1) both}
@keyframes praise{0%{opacity:0;transform:translateY(30px) scale(.3) rotate(-8deg)}25%{opacity:1;transform:translateY(0) scale(1.18) rotate(3deg)}70%{opacity:1;transform:translateY(-10px) scale(1) rotate(0)}100%{opacity:0;transform:translateY(-44px) scale(1.06)}}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(205,234,255,.74);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--hd);font-weight:800;font-size:24px;z-index:20;text-align:center;padding:20px}
.ov.on{display:flex}
.ov .row{display:flex;gap:10px}
.ov .sub2{font-size:16px;font-weight:700;color:var(--tx);max-width:300px}
#ccWinH,#arWinH,#gWinH{font-size:36px;font-weight:900;line-height:1.1;background:linear-gradient(90deg,#ff3b4e,#ff9500,#ffd60a,#34c759,#2f6bff,#a259ff,#ff3b4e);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rb 2s linear infinite,pop 0.7s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 3px 0 #fff)}
@keyframes rb{to{background-position:200% 0}}
@keyframes pop{0%{transform:scale(.2) rotate(-10deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.stars{display:flex;gap:10px;font-size:64px;line-height:1}
.stars span{display:inline-block;color:#bcd6ec;transform:scale(0);opacity:0}
.stars span.y{color:#ffc53d;text-shadow:0 0 20px rgba(255,197,61,.95),0 4px 0 #e59a00}
.ov.on .stars span{animation:starIn .7s cubic-bezier(.2,1.8,.4,1) forwards}
.ov.on .stars span:nth-child(2){animation-delay:.25s}.ov.on .stars span:nth-child(3){animation-delay:.5s}
@keyframes starIn{0%{transform:scale(0) rotate(-180deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.stars span.y{animation:starIn .7s cubic-bezier(.2,1.8,.4,1) forwards,twinkle 1.6s ease-in-out 1s infinite!important}
@keyframes twinkle{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25) drop-shadow(0 0 8px #fff)}}
#flash{position:fixed;inset:0;background:radial-gradient(circle at 50% 50%,#fff 0,rgba(255,255,255,.55) 45%,rgba(255,255,255,0) 75%);opacity:0;pointer-events:none;z-index:15}
#flash.on{animation:fl .7s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
/* ---------- little-kid style: bigger, chunkier, softer (blue kept) ---------- */
html,body{font-size:17px}
#bgb{background:radial-gradient(130px 56px at 14% 11%,rgba(255,255,255,.95) 0,rgba(255,255,255,0) 70%),radial-gradient(170px 66px at 84% 20%,rgba(255,255,255,.9) 0,rgba(255,255,255,0) 70%),radial-gradient(150px 60px at 22% 88%,rgba(255,255,255,.9) 0,rgba(255,255,255,0) 70%),radial-gradient(120px 50px at 90% 80%,rgba(255,255,255,.85) 0,rgba(255,255,255,0) 70%)}
header{height:84px;gap:10px}
h2{font-size:18px}h2::before{display:none}
h1{font-size:38px;line-height:.95;white-space:normal;letter-spacing:-.5px;filter:drop-shadow(0 3px 0 #fff)}
button{font-weight:800;font-size:18px;min-height:58px;border:0;border-radius:24px;padding:0 20px;box-shadow:0 5px 0 #a9d3f5,0 10px 16px rgba(50,140,220,.22);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(4px) scale(.98);box-shadow:0 1px 0 #a9d3f5,0 3px 6px rgba(50,140,220,.2)}
button.on{box-shadow:0 5px 0 #a9d3f5,0 0 0 4px var(--ac),var(--gl)}
button.sn{width:52px;min-width:52px;min-height:52px;font-size:22px}
.bk{width:56px;min-width:56px;font-size:28px;padding:0}
header>button:not(.bk):not(.sn),.pri,.sg button.on{box-shadow:0 5px 0 #1a63c4,0 10px 16px rgba(30,100,200,.3)}
header>button:not(.bk):not(.sn):active,.pri:active,.sg button.on:active{box-shadow:0 1px 0 #1a63c4,0 3px 6px rgba(30,100,200,.3)}
.tag{font-size:20px;font-weight:800;color:var(--hd);margin:0 4px 14px}
.gl{grid-auto-rows:minmax(184px,auto);gap:14px}
.gc{border-radius:34px;box-shadow:0 7px 0 #b4d9f7,0 14px 22px rgba(50,140,220,.22);gap:10px}
.gc:active{transform:translateY(5px);box-shadow:0 2px 0 #b4d9f7,0 4px 8px rgba(50,140,220,.2)}
.gc .i{width:92px;height:92px;border-radius:30px;font-size:44px}
.gc .i svg{width:52px;height:52px}
.gc b{font-size:22px}
.gc small{font-size:14px}
.gc.soon{box-shadow:none}
.big{min-height:84px;border-radius:28px}.big b{font-size:24px}.big small{font-size:15px}
.lbl{font-size:16px;letter-spacing:.02em;text-transform:none}
.sg{gap:10px}.sg button{min-height:56px}
.stat{font-size:17px;border-radius:18px;border-bottom-width:5px;padding:8px 14px 6px}
.bar{gap:10px;margin:2px 0 12px}.bar button{min-height:58px;border-radius:24px;padding:0 22px}
#ccW,#arW{border-radius:34px}
#ccPraise,#arPraise{font-size:60px}
#ccWinH,#arWinH,#gWinH{font-size:44px}
.stars{font-size:84px;gap:8px}
.ov{font-size:28px}.ov .sub2{font-size:20px;max-width:320px}
.ov .row{gap:14px}.ov .row button{min-height:64px;font-size:20px}
/* ---------- Tic Tac Toe + Connect 4 ---------- */
.gc[data-g=c4] .i{background:linear-gradient(145deg,#4aa2ff,#1f6fe8)}
.turn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;margin:0 0 10px;padding:6px 16px;border-radius:24px;background:#fff;box-shadow:0 5px 0 #b4d9f7,0 10px 16px rgba(50,140,220,.18);color:var(--hd);font-size:22px;font-weight:900;flex:none}
.bw{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.mi{display:inline-block;width:24px;height:24px;vertical-align:-6px}
.turn .mi{width:34px;height:34px;vertical-align:middle}
.mi svg{width:100%;height:100%;display:block;fill:none;stroke-width:17;stroke-linecap:round}
.p1 svg{stroke:#2f6bff}.p2 svg{stroke:#ff5f9e}
.mi.dot{border-radius:50%;box-shadow:inset 0 -3px 4px rgba(0,0,0,.18),inset 0 2px 3px rgba(255,255,255,.55)}
.d1{background:radial-gradient(circle at 35% 30%,#ff8a98,#ff3b4e)}.d2{background:radial-gradient(circle at 35% 30%,#fff08a,#ffc81a)}
.tb{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:10px;padding:12px;border-radius:34px;background:linear-gradient(160deg,#f6fcff,#cde9ff);box-shadow:var(--sh),inset 0 0 0 2px rgba(255,255,255,.85)}
.tc{min-height:0;height:100%;width:100%;padding:0;border-radius:26px;background:#fff;box-shadow:0 5px 0 #b4d9f7,inset 0 0 0 2px rgba(80,165,240,.12);display:flex;align-items:center;justify-content:center}
.tc.p1,.tc.p2{pointer-events:none}
.tc svg{width:76%;height:76%;fill:none;stroke-width:16;stroke-linecap:round}
.tc.nw svg{animation:pcin .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pcin{0%{transform:scale(0) rotate(-25deg)}100%{transform:scale(1) rotate(0)}}
.tc.win{background:#fff6cc;animation:wpulse .7s ease-in-out 3}
@keyframes wpulse{50%{transform:scale(1.07)}}
.fb{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);padding:8px;border-radius:30px;background:linear-gradient(160deg,#4aa2ff,#1f6fe8);box-shadow:0 7px 0 #1a56b8,0 14px 22px rgba(30,100,200,.3);overflow:hidden;touch-action:manipulation}
.fh{position:relative;margin:3px;border-radius:50%;background:#e6f4ff;box-shadow:inset 0 4px 6px rgba(20,70,150,.35)}
.fh .pc{position:absolute;inset:0;display:block;border-radius:50%;box-shadow:inset 0 -4px 6px rgba(0,0,0,.18),inset 0 3px 4px rgba(255,255,255,.5)}
.fh.p1 .pc{background:radial-gradient(circle at 35% 30%,#ff8a98,#ff3b4e)}
.fh.p2 .pc{background:radial-gradient(circle at 35% 30%,#fff08a,#ffc81a)}
.fh .pc.nw{animation:fall calc(.25s + var(--dr)*.07s) both}
@keyframes fall{0%{transform:translateY(calc(var(--dr)*-108%));animation-timing-function:cubic-bezier(.5,0,1,.6)}78%{transform:translateY(0);animation-timing-function:ease-out}88%{transform:translateY(-9%);animation-timing-function:ease-in}100%{transform:translateY(0)}}
.fh.win .pc{outline:4px solid #fff;animation:wpulse .6s ease-in-out 3}
/* landscape: sidebar + big play area */
@media (orientation:landscape) and (max-height:560px){
 header{height:50px}
 .gl{grid-template-columns:repeat(4,1fr)}
 #mnB{max-width:640px;width:100%;margin:auto}
 #cc>header,#ar>header{flex-wrap:wrap;height:auto;gap:6px;margin-bottom:6px}
 #cc h2,#ar h2{order:-1;flex:1 0 100%;font-size:17px}
 #cc .stat,#ar .stat{min-width:0;padding:5px 9px;font-size:13px}
 #cc.on,#ar.on{display:grid;grid-template-columns:200px minmax(0,1fr);grid-template-rows:repeat(5,min-content) 1fr;column-gap:12px}
 #cc.on>*,#ar.on>*{grid-column:1;min-width:0}
 #cc.on>#ccW,#ar.on>#arW{grid-column:2;grid-row:1/-1;min-height:0;height:100%;margin-bottom:0}
 #cc .bar,#ar .bar{margin:2px 0 8px}
}
</style></head><body>
<div id="bgb"></div>

<div id="home" class="v on"><header><h1>Mason's Games</h1><button class="sn tsnd"></button><button class="sn thap"></button></header>

<div id="gl" class="gl">
<button class="gc" data-g="cc"><span class="i"><svg viewBox="0 0 32 32"><path d="M8 9h11a5 5 0 015 5v4a5 5 0 005 5h0" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" opacity=".9"/><circle cx="8" cy="9" r="5" fill="#fff"/><circle cx="25" cy="24" r="5" fill="#fff"/><circle cx="8" cy="9" r="2.4" fill="#ff3b4e"/><circle cx="25" cy="24" r="2.4" fill="#2f6bff"/></svg></span><span><b>Color Connect</b><br><small id="hs-cc"></small></span></button>

<button class="gc" data-g="ttt"><span class="i"><svg viewBox="0 0 32 32"><path d="M12 5v22M20 5v22M5 12h22M5 20h22" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9"/><circle cx="16" cy="16" r="3.2" fill="none" stroke="#fff" stroke-width="2.6"/><path d="M21.6 21.6l4.8 4.8M26.4 21.6l-4.8 4.8" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/></svg></span><span><b>Tic Tac Toe</b><br><small id="hs-ttt"></small></span></button>
<button class="gc" data-g="c4"><span class="i"><svg viewBox="0 0 32 32"><g fill="#fff" opacity=".55"><circle cx="8" cy="8" r="4.3"/><circle cx="16" cy="8" r="4.3"/><circle cx="24" cy="8" r="4.3"/><circle cx="8" cy="16" r="4.3"/><circle cx="24" cy="16" r="4.3"/></g><circle cx="16" cy="16" r="4.3" fill="#ff3b4e"/><circle cx="8" cy="24" r="4.3" fill="#ff3b4e"/><circle cx="16" cy="24" r="4.3" fill="#ffd60a"/><circle cx="24" cy="24" r="4.3" fill="#ffd60a"/></svg></span><span><b>Connect 4</b><br><small id="hs-c4"></small></span></button>

</div></div>

<div id="mnB"></div></div>

<div id="cc" data-th="cc" class="v"><header><button class="bk" data-back>←</button><h2>Color Connect</h2><button class="sn tsnd"></button><button id="ccNew">New</button></header>
<div class="bar"><div><span class="stat" id="ccLv"></span><span class="stat" id="ccLinks"></span></div><span class="stat" id="ccFill"></span></div>
<div id="ccW"><canvas id="ccC"></canvas><div id="ccPraise"></div></div>
<div class="bar"><div><button id="ccReset">↺ Clear</button><button id="ccHint">💡 3</button></div></div></div>

<div id="ar" data-th="ar" class="v"><header><button class="bk" data-back>←</button><h2>Arrow Zoom</h2><button class="sn tsnd"></button><button id="arNew">New</button></header>

<script>
/*LOGIC*/
const rnd=n=>Math.random()*n|0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
/* random Hamiltonian path over an N x N grid: start from a snake, then "backbite" it into a winding path */
function ccHam(N){const T=N*N,p=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)p.push(y%2?y*N+N-1-x:y*N+x);
 const pos=new Int32Array(T),fix=()=>{for(let i=0;i<T;i++)pos[p[i]]=i};fix();
 const nb=i=>{const r=i/N|0,c=i%N,o=[];if(r>0)o.push(i-N);if(r<N-1)o.push(i+N);if(c>0)o.push(i-1);if(c<N-1)o.push(i+1);return o};
 const rev=(a,b)=>{while(a<b){const t=p[a];p[a]=p[b];p[b]=t;a++;b--}};
 for(let it=0;it<T*40;it++){
  if(Math.random()<.5){const o=nb(p[T-1]),k=pos[o[rnd(o.length)]];if(k>=T-2)continue;rev(k+1,T-1)}
  else{const o=nb(p[0]),k=pos[o[rnd(o.length)]];if(k<=1)continue;rev(0,k-1)}
  fix()}
 return p}
function ccSplit(T,K){const mn=T/K>=4?3:2;
 for(let tr=0;tr<300;tr++){const cuts=new Set();while(cuts.size<K-1)cuts.add(mn+rnd(T-2*mn+1));
  const a=[0,...[...cuts].sort((x,y)=>x-y),T];let ok=true;for(let i=1;i<a.length;i++)if(a[i]-a[i-1]<mn){ok=false;break}if(ok)return a}
 const a=[];for(let i=0;i<=K;i++)a.push(Math.round(i*T/K));return a}
function ccGen(N,K){const p=ccHam(N),a=ccSplit(N*N,K),sol=[];for(let i=0;i<K;i++)sol.push(p.slice(a[i],a[i+1]));return sol}
const CCD={easy:{b:4,m:6,n:'Easy'},med:{b:5,m:8,n:'Medium'},hard:{b:6,m:9,n:'Hard'}};
function ccParams(dif,lv){const D=CCD[dif]||CCD.med,N=Math.min(D.m,D.b+((lv-1)/3|0));return{N,K:Math.max(3,Math.min(8,dif=='hard'?N:N-1))}}
function ccOwn(s){s.own.fill(-1);s.paths.forEach((p,c)=>p.forEach(i=>s.own[i]=c))}
function ccComp(s,k){const p=s.paths[k];return p.length>1&&p[0]!=p[p.length-1]&&s.dot[p[p.length-1]]==k}
function ccDone(s){let n=0;for(let k=0;k<s.K;k++)if(ccComp(s,k))n++;return n}
/* one step of the active path onto neighbouring cell j. pure game rules, no effects */
function ccApply(s,j){const c=s.act,p=s.paths[c],N=s.N,h=p[p.length-1],df=Math.abs(h-j);
 if(j<0||j>=N*N||(df!=1&&df!=N)||(df==1&&(h/N|0)!=(j/N|0)))return{k:'none'};
 const done=p.length>1&&p[0]!=h&&s.dot[h]==c;
 if(p.length>1&&j==p[p.length-2]){p.pop();ccOwn(s);return{k:'back'}}
 if(done)return{k:'none'};
 const i=p.indexOf(j);if(i>=0){p.length=i+1;ccOwn(s);return{k:'trunc'}}
 const d=s.dot[j];if(d>=0&&d!=c)return{k:'nope'};
 let cut=-1;const o=s.own[j];if(o>=0&&o!=c){s.paths[o].length=s.paths[o].indexOf(j);cut=o}
 p.push(j);ccOwn(s);return{k:'move',cut,link:s.dot[j]==c}}
/* ---- Arrow Zoom rules ---- */
function arParams(dif,lv){const S=[[4,5],[4,6],[5,6],[5,7],[6,7],[6,8],[7,8],[7,9]],o={easy:[0,4,4,.55],med:[2,6,6,.7],hard:[4,7,9,.82]}[dif]||[0,4,4,.55],i=Math.min(o[1],o[0]+((lv-1)/2|0));return{C:S[i][0],R:S[i][1],ml:o[2],fill:o[3]}}
/* built backwards: each new arrow's straight exit lane must avoid every arrow already placed, so removing them newest-first always works */
function arGen(C,R,ml,fill){const T=C*R,occ=new Int8Array(T),out=[],D=[[1,0],[-1,0],[0,1],[0,-1]];let cover=0,fails=0;
 while(fails<500&&cover<fill*T){
  const em=[];for(let i=0;i<T;i++)if(!occ[i])em.push(i);if(em.length<2)break;
  const len=2+rnd(ml-1),p=[em[rnd(em.length)]],used=new Set(p);let pd=-1;
  for(let k=1;k<len;k++){const h=p[p.length-1],hx=h%C,hy=h/C|0,cand=[];
   D.forEach((d,di)=>{const nx=hx+d[0],ny=hy+d[1];if(nx<0||ny<0||nx>=C||ny>=R)return;const j=ny*C+nx;if(!occ[j]&&!used.has(j))cand.push(di)});
   if(!cand.length)break;const di=pd>=0&&cand.includes(pd)&&Math.random()<.55?pd:cand[rnd(cand.length)];
   const nj=(hy+D[di][1])*C+hx+D[di][0];p.push(nj);used.add(nj);pd=di}
  if(p.length<2){fails++;continue}
  const h=p[p.length-1],v=p[p.length-2],dx=(h%C)-(v%C),dy=(h/C|0)-(v/C|0);let x=h%C+dx,y=(h/C|0)+dy,ok=true;
  while(x>=0&&x<C&&y>=0&&y<R){const j=y*C+x;if(occ[j]||used.has(j)){ok=false;break}x+=dx;y+=dy}
  if(!ok){fails++;continue}
  p.forEach(i=>occ[i]=1);cover+=p.length;out.push({p,c:rnd(8)})}
 return out}
function arMake(s,p,c,k){const C=s.C,R=s.R,n=p.length,h=p[n-1],v=p[n-2],dx=(h%C)-(v%C),dy=(h/C|0)-(v/C|0),ray=[];let x=h%C+dx,y=(h/C|0)+dy;
 while(x>=0&&x<C&&y>=0&&y<R){ray.push(y*C+x);x+=dx;y+=dy}
 return{p,c,dx,dy,ray,alive:true,anim:null,shake:0,flash:0,born:k}}
function arOcc(s){s.occ.fill(-1);s.A.forEach((a,k)=>{if(a.alive)a.p.forEach(i=>s.occ[i]=k)})}
function arFree(s,k){for(const i of s.A[k].ray)if(s.occ[i]>=0)return{free:false,by:s.occ[i]};return{free:true,by:-1}}
/*END*/

const $=id=>document.getElementById(id);
const ST={get(k,d){try{const v=localStorage.getItem('mg_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('mg_'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('mg_'+k)}catch(e){}}};
const SV={get:g=>ST.get('sv_'+g,null),set:(g,d,o,data)=>ST.set('sv_'+g,{d,o,data}),clear:g=>ST.del('sv_'+g)};

const ICO=(()=>{const s=b=>'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:auto">'+b+'</svg>',spk='<path d="M4 9.5v5h3.5l4.5 4V5.5l-4.5 4z" fill="currentColor"/>';
 return{snd:s(spk+'<path d="M15.5 9a4 4 0 010 6M18.2 6.2a8 8 0 010 11.6"/>'),sndOff:s(spk+'<path d="M16 9.5l5 5M21 9.5l-5 5"/>'),
  hap:s('<rect x="8" y="3.5" width="8" height="17" rx="2"/><path d="M4.5 8.5v7M19.5 8.5v7M1.8 10.5v3M22.2 10.5v3"/>'),hapOff:s('<rect x="8" y="3.5" width="8" height="17" rx="2"/><path d="M4 4l16 16"/>')}})();

/* ---------- haptics (native Capacitor plugin in the app, browser vibrate as fallback) ---------- */
const HAP=(()=>{let on=ST.get('hap',1)!==0,last=0;
 const V={LIGHT:8,MEDIUM:16,HEAVY:34,SUCCESS:[18,50,18],WARNING:[30,40,30]},K={ui:'LIGHT',step:'LIGHT',pop:'MEDIUM',connect:'MEDIUM',win:'SUCCESS',nope:'WARNING',hint:'MEDIUM',whoosh:'LIGHT',boing:'WARNING'};
 function fire(k){const pl=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Haptics,fb=()=>{try{navigator.vibrate&&navigator.vibrate(V[k])}catch(e){}};
  if(!pl)return fb();try{const r=V[k].length?pl.notification({type:k}):pl.impact({style:k});r&&r.catch&&r.catch(fb)}catch(e){fb()}}
 const paint=()=>document.querySelectorAll('.thap').forEach(b=>{b.innerHTML=on?ICO.hap:ICO.hapOff;b.setAttribute('aria-label',on?'Vibration on':'Vibration off')});
 return{p(n){const k=K[n];if(!on||!k)return;const t=performance.now();if(!V[k].length&&t-last<30)return;last=t;fire(k)},toggle(){on=!on;ST.set('hap',on?1:0);paint();if(on)fire('MEDIUM')},paint}})();

/* ---------- sound: everything is synthesized with Web Audio, no files needed ---------- */
const SFX=(()=>{let ac=null,out=null,nb=null,on=ST.get('snd',1)!==0;const last={};
 function init(){if(ac)return ac;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;ac=new A();
  const cp=ac.createDynamicsCompressor();cp.threshold.value=-14;cp.ratio.value=4;out=ac.createGain();out.gain.value=.7;out.connect(cp);cp.connect(ac.destination);
  const n=ac.sampleRate|0,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;nb=b}catch(e){ac=null}return ac}
 const gate=(n,ms)=>{const t=performance.now();if(last[n]&&t-last[n]<ms)return false;last[n]=t;return true};
 function tone(f,d,ty,v,t0,sl){const a=ac;if(!a)return;const t=a.currentTime+(t0||0),o=a.createOscillator(),g=a.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);
  if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*sl),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.15,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(out);o.start(t);o.stop(t+d+.03)}
 function noise(d,v,hp,t0){const a=ac;if(!a||!nb)return;const t=a.currentTime+(t0||0),s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=nb;f.type='highpass';f.frequency.value=hp||2000;
  g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(out);s.start(t,Math.random()*.5);s.stop(t+d+.02)}
 const SC=[0,2,4,7,9],note=k=>392*Math.pow(2,(SC[k%5]+12*((k/5|0)%3))/12);
 return{unlock(){init();if(ac&&ac.state=='suspended')ac.resume()},
  toggle(){on=!on;ST.set('snd',on?1:0);this.paint();if(on){init();this.p('ui')}},
  paint(){document.querySelectorAll('.tsnd').forEach(b=>{b.innerHTML=on?ICO.snd:ICO.sndOff;b.setAttribute('aria-label',on?'Sound on':'Sound off')})},
  p(n,a){HAP.p(n);if(!on||!init())return;if(ac.state=='suspended')ac.resume();
   switch(n){
    case'ui':if(gate(n,60))tone(660,.07,'triangle',.1);break;
    case'step':if(gate(n,40)){tone(note(a||0),.16,'triangle',.17);tone(note(a||0)*2,.09,'sine',.04)}break;
    case'whoosh':noise(.22,.14,900);tone(260,.2,'sine',.09,0,3);break;
    case'boing':if(gate(n,150)){tone(150,.32,'triangle',.22,0,2.8);tone(420,.25,'sine',.06,.04,.6)}break;
    case'back':if(gate(n,60))tone(300,.07,'sine',.08,0,.8);break;
    case'cut':if(gate(n,80))tone(360,.12,'sine',.12,0,.45);break;
    case'nope':if(gate(n,220))tone(190,.15,'triangle',.18,0,.6);break;
    case'pop':if(gate(n,28)){noise(.05,.22,2600);tone(620+Math.min(a||0,26)*58,.1,'sine',.2,0,.35)}break;
    case'connect':[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.16,i*.065));tone(2093,.3,'sine',.06,.26);break;
    case'hint':[880,1175,1568].forEach((f,i)=>tone(f,.2,'sine',.12,i*.08));break;
    case'star':tone(784*Math.pow(2,(a||0)*4/12),.25,'triangle',.18);tone(1568*Math.pow(2,(a||0)*4/12),.3,'sine',.07,.04);break;
    case'win':[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.28,'triangle',.17,i*.09));[1047,1319,1568,2093].forEach(f=>tone(f,.9,'sine',.1,.6));
     for(let i=0;i<8;i++)tone(R(1500,3200),.15,'sine',.05,.7+i*.1);break}}}})();

/* ---------- particles (bubble pops, sparkles, confetti, fireworks) drawn on one full-screen canvas ---------- */
const FX=(()=>{const cv=$('fx'),c=cv.getContext('2d');let P=[],run=0,last=0,W=0,H=0,dpr=1;
 const size=()=>{dpr=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr};size();addEventListener('resize',size);
 const COLS=['#ff3b4e','#ff9500','#ffd60a','#34c759','#2f6bff','#a259ff','#ff6ec7','#14c4c4'];
 function add(o){if(P.length>1100)P.shift();P.push(Object.assign({x:0,y:0,vx:0,vy:0,g:0,u:0,max:.6,sz:4,col:'#fff',rot:0,vr:0,ty:'dot',r0:0,r1:0,dr:.992},o));if(!run){run=1;last=performance.now();requestAnimationFrame(tick)}}
 function star(x,y,s,rot){c.save();c.translate(x,y);c.rotate(rot);c.beginPath();for(let i=0;i<8;i++){const r=i%2?s*.3:s,a=i*Math.PI/4;c.lineTo(Math.cos(a)*r,Math.sin(a)*r)}c.closePath();c.fill();c.restore()}
 function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
  for(let i=P.length-1;i>=0;i--){const p=P[i];p.u+=dt;if(p.u>=p.max||p.y>H+80||p.x<-100||p.x>W+100){P.splice(i,1);continue}
   const dd=Math.pow(p.dr,dt*60);p.vy+=p.g*dt;p.vx*=dd;p.vy*=dd;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;const k=p.u/p.max;
   if(p.ty=='ring'){const r=p.r0+(p.r1-p.r0)*(1-(1-k)*(1-k));c.globalAlpha=1-k;c.strokeStyle=p.col;c.lineWidth=Math.max(.6,p.sz*(1-k));c.beginPath();c.arc(p.x,p.y,r,0,6.283);c.stroke()}
   else if(p.ty=='dot'){const r=p.sz*(1-k*.4);c.globalAlpha=Math.min(1,(1-k)*1.7);c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,r,0,6.283);c.fill();if(r>2.4){c.fillStyle='rgba(255,255,255,.75)';c.beginPath();c.arc(p.x-r*.3,p.y-r*.32,r*.3,0,6.283);c.fill()}}
   else if(p.ty=='star'){c.globalAlpha=Math.min(1,(1-k)*1.8);c.fillStyle=p.col;star(p.x,p.y,p.sz*(1-k*.5)*(.75+.25*Math.sin(p.u*20)),p.rot)}
   else if(p.ty=='conf'){c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.scale(1,Math.cos(p.u*7+p.sz));c.globalAlpha=k>.75?(1-k)*4:1;c.fillStyle=p.col;c.fillRect(-p.sz/2,-p.sz*.32,p.sz,p.sz*.64);c.restore()}
   else if(p.ty=='bub'){const x=p.x+Math.sin(p.u*3+p.rot)*10,a=k>.8?(1-k)*5:1;c.globalAlpha=.9*a;c.lineWidth=1.8;c.strokeStyle='rgba(255,255,255,.95)';c.fillStyle=p.col;c.beginPath();c.arc(x,p.y,p.sz,0,6.283);c.fill();c.stroke();c.fillStyle='rgba(255,255,255,.85)';c.beginPath();c.ellipse(x-p.sz*.35,p.y-p.sz*.4,p.sz*.28,p.sz*.15,-.6,0,6.283);c.fill()}}
  c.globalAlpha=1;if(P.length)requestAnimationFrame(tick);else{run=0;c.clearRect(0,0,W,H)}}
 return{COLS,
  pop(x,y,P_,sz){add({ty:'ring',x,y,col:P_.b,r0:sz*.2,r1:sz*1.2,max:.42,sz:sz*.2});add({ty:'ring',x,y,col:'#fff',r0:sz*.1,r1:sz*.85,max:.3,sz:sz*.12});
   for(let i=0;i<9;i++){const a=R(0,6.283),v=R(sz*3,sz*7);add({ty:'dot',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sz*2,g:sz*14,max:R(.45,.85),sz:R(sz*.09,sz*.19),col:i%3?P_.b:P_.l,dr:.96})}
   for(let i=0;i<2;i++)add({ty:'star',x:x+R(-sz,sz)*.5,y:y+R(-sz,sz)*.5,vy:-R(10,40),max:R(.4,.7),sz:R(sz*.28,sz*.5),col:'#fff',rot:R(0,3),vr:R(-4,4)})},
  step(x,y,P_,sz){add({ty:'ring',x,y,col:P_.l,r0:sz*.1,r1:sz*.6,max:.3,sz:sz*.1});for(let i=0;i<3;i++){const a=R(0,6.283),v=R(sz*1.5,sz*3.5);add({ty:'dot',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:sz*6,max:R(.3,.5),sz:R(sz*.06,sz*.12),col:P_.b,dr:.95})}},
  spark(x,y,col,sz){add({ty:'star',x,y,vx:R(-30,30),vy:R(-60,-10),max:R(.35,.6),sz:sz||R(6,11),col,rot:R(0,3),vr:R(-6,6)})},
  confetti(n){for(let i=0;i<n;i++)add({ty:'conf',x:R(0,W),y:R(-H*.35,-10),vx:R(-60,60),vy:R(80,200),g:60,max:R(2.6,4),sz:R(8,15),col:COLS[rnd(8)],rot:R(0,6),vr:R(-7,7),dr:.995})},
  cannon(x,y,dir,n){for(let i=0;i<n;i++)add({ty:'conf',x,y,vx:dir*R(60,420),vy:-R(500,1000),g:850,max:R(1.8,3),sz:R(8,14),col:COLS[rnd(8)],rot:R(0,6),vr:R(-9,9),dr:.985})},
  firework(x,y){const col=COLS[rnd(8)];add({ty:'ring',x,y,col:'#fff',r0:4,r1:70,max:.35,sz:5});for(let i=0;i<34;i++){const a=i/34*6.283+R(-.1,.1),v=R(130,330);add({ty:'dot',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:240,max:R(.8,1.35),sz:R(3,5.5),col:i%4?col:COLS[rnd(8)],dr:.94})}
   for(let i=0;i<6;i++)add({ty:'star',x:x+R(-30,30),y:y+R(-30,30),max:R(.5,.9),sz:R(9,16),col:'#fff',rot:R(0,3),vr:R(-5,5)})},
  risers(n){for(let i=0;i<n;i++)add({ty:'bub',x:R(0,W),y:H+R(10,120),vy:-R(160,360),max:R(2.6,4.5),sz:R(8,22),col:'rgba(160,215,255,.28)',rot:R(0,6)})}}})();

function menuRender(g){mg=g;$('menu').dataset.th=g;const M=GM[g],sv=SV.get(g),mo=menuOpts(g);$('mnT').textContent=M.t;let h='';
 if(sv)h+=`<button class="big pri" id="mnC"><b>Continue</b><small>${sv.d||''}</small></button>`;
 M.o.forEach((x,i)=>{if(x.k=='dif'&&mo.mode=='two')return;h+=`<div class="lbl">${x.n}</div><div class="sg" id="mnO${i}"></div>`});
 h+=`<button class="big ${sv?'':'pri'}" id="mnS"><b>▶ Play</b><small>${M.sub?M.sub(mo):'Level '+(g=='ar'?aprog:prog)(mo.dif).lv}</small></button>`;
 h+=`<div class="lbl">Your progress</div><div class="card">${scoresHTML(g)}</div>`;$('mnB').innerHTML=h;
 M.o.forEach((x,i)=>x.k=='dif'&&mo.mode=='two'?0:seg('mnO'+i,x.v,mo[x.k],v=>{mo[x.k]=v;ST.set('opt_'+g,mo);menuRender(g)}));
 if(sv)$('mnC').onclick=()=>launch(g,sv.o,true);
 $('mnS').onclick=()=>{const st=()=>launch(g,{...mo},false);sv?askYN('Start a new game? Your saved game will be replaced.',st):st()}}
function askYN(msg,cb){const o=$('yn');$('ynT').textContent=msg;o.classList.add('on');$('ynY').onclick=()=>{o.classList.remove('on');cb()};$('ynN').onclick=()=>o.classList.remove('on')}
function launch(g,o,resume){pend={g,o,resume};go(g)}

/* ---------- navigation ---------- */
const VS=['home','menu','cc','ar','ttt','c4'],GAMES=['cc','ar'],SAVE={cc:()=>ccSave(),ar:()=>arSave()};
const ENTER={cc(p){const sv=p&&p.resume?SV.get('cc'):null,o=p&&p.o?p.o:menuOpts('cc');$('ccWin').classList.remove('on');
 if(sv&&sv.data)ccInit(sv.o.dif,sv.o.lv,sv.data);else ccInit(o.dif,prog(o.dif).lv);
 ccRun++;ccLayout();ccUI();const id=ccRun;requestAnimationFrame(t=>ccLoop(t,id))},
 ttt(p){$('gWin').classList.remove('on');ttInit(p&&p.o?p.o:menuOpts('ttt'));gLayout('ttt');ttRender()},
 c4(p){$('gWin').classList.remove('on');c4Init(p&&p.o?p.o:menuOpts('c4'));gLayout('c4');c4Render()},
 ar(p){const sv=p&&p.resume?SV.get('ar'):null,o=p&&p.o?p.o:menuOpts('ar');$('arWin').classList.remove('on');
 if(sv&&sv.data)arInit(sv.o.dif,sv.o.lv,sv.data);else arInit(o.dif,aprog(o.dif).lv);
 arRun++;arLayout();arUI();const id=arRun;requestAnimationFrame(t=>arLoop(t,id))}};
function saveCur(id){try{SAVE[id]&&SAVE[id]()}catch(e){}}
function show(id,g){if(GAMES.includes(cur)&&cur!=id)saveCur(cur);cur=id;VS.forEach(k=>$(k).classList.toggle('on',k==id));
 if(id=='home')homeStats();else if(id=='menu')menuRender(g||mg);else enter(id)}
function enter(id){const p=pend&&pend.g==id?pend:null;pend=null;if(ENTER[id](p)===false){history.replaceState({v:'menu',g:id},'');show('menu',id)}}
function go(id,g){history.pushState({v:id,g},'');show(id,g)}
addEventListener('popstate',e=>{const s=e.state;$('ccWin').classList.remove('on');$('arWin').classList.remove('on');$('gWin').classList.remove('on');$('yn').classList.remove('on');if(!s||s.v=='home')show('home');else show(s.v,s.g)});
addEventListener('pagehide',()=>saveCur(cur));
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveCur(cur)});
document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{SFX.unlock();SFX.p('ui');go('menu',b.dataset.g)});
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{SFX.p('ui');history.back()});
document.querySelectorAll('.tsnd').forEach(b=>b.onclick=()=>SFX.toggle());
document.querySelectorAll('.thap').forEach(b=>b.onclick=()=>HAP.toggle());
addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('pointerdown',e=>{SFX.unlock();},true);
function homeStats(){const ap=ST.get('aprog',{});let aw=0,as=0;['easy','med','hard'].forEach(d=>{const x=ap[d];if(x){aw+=x.w||0;as+=x.st||0}});$('hs-ar').textContent=aw?`Levels won: ${aw} · ★ ${as}`:'Tap arrows to zoom!';const pr=ST.get('prog',{});let w=0,st=0;['easy','med','hard'].forEach(d=>{const x=pr[d];if(x){w+=x.w||0;st+=x.st||0}});$('hs-cc').textContent=w?`Levels won: ${w} · ★ ${st}`:'Connect the colors!';
 const rw=k=>{const o=ST.get(k,{});let n=0;['easy','med','hard'].forEach(d=>{if(o[d])n+=o[d].w||0});return n},tw=rw('tprog'),fw=rw('fprog');
 $('hs-ttt').textContent=tw?`Games won: ${tw}`:'Get three in a row!';$('hs-c4').textContent=fw?`Games won: ${fw}`:'Get four in a row!'}
SFX.paint();HAP.paint();history.replaceState({v:'home'},'');homeStats();
</script></body></html>
